server {
    listen 80;
    server_name _;

    # This location is callable only by nginx's auth_request subrequest.  It
    # passes the original request metadata to FastAPI without forwarding a body.
    location = /_internal/database-authorize {
        internal;
        proxy_pass http://web-locnet:8000/_internal/database-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Database-Auth-Request 1;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
    }

    location ^~ /admin/database/ {
        auth_request /_internal/database-authorize;
        error_page 401 = @database_sign_in;
        proxy_pass http://sqlite-web:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @database_sign_in {
        return 303 /;
    }

    location / {
        proxy_pass http://web-locnet:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
