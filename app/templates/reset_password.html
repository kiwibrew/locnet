{# Password-reset completion page. #}
{% extends "base.html" %}
{% block title %}Reset password | Community Network Builder{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <h1 class="h3 mb-3">Enter your reset code</h1>
      {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/reset-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
          <label for="code" class="form-label">Reset code</label>
          <textarea id="code" name="code" class="form-control" rows="3" required autocomplete="one-time-code"></textarea>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">New password</label>
          <input id="password" name="password" type="password" class="form-control" minlength="8" maxlength="128" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary">Change password</button>
      </form>
      <a class="d-block mt-3" href="/">Return to sign in</a>
    </div>
  </div>
{% endblock %}
